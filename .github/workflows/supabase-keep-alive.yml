name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-and-keep-active:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Games Table
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/games?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Ping failed with status $HTTP_STATUS"
            exit 1
          fi
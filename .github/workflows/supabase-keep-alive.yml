name: Supabase Keep Alive & Self Renew

on:
  schedule:
    - cron: '0 0 */3 * *' # Berjalan otomatis tiap 3 hari
  workflow_dispatch:

jobs:
  ping-and-auto-renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Mengizinkan bot melakukan push commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Supabase Games Table
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/games?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Ping failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Auto-commit to reset 60-day GitHub timer
        run: |
          date +%Y-%m-%d > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if ! git diff --staged --quiet; then
            git commit -m "chrono: automated keepalive touch"
            git push
          fi